# Checks every push and pull request. Workers Builds does the deploys; this
# only blocks a broken branch (lint, format, types, tests, static build).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Spec 0002: build and check content first. It catches what a commit
      # made without the pre-commit hook let through.
      - run: pnpm content
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Spec 0005: Turnstile's always pass test site key; production sets the real one.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          # Feature 13: a local address keeps CI builds out of search (robots
          # disallows everything); no Umami id, so no tracker loads.
          NEXT_PUBLIC_SITE_URL: http://localhost:8787
